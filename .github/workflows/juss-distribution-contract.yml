name: Juss distribution contract

on:
  push:
    paths:
      - 'distribution/**'
      - '.github/workflows/juss-distribution-contract.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'distribution/**'
      - '.github/workflows/juss-distribution-contract.yml'

permissions:
  contents: read

jobs:
  worker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check distribution/src/worker.mjs
      - name: Test Worker and checked-out skill contracts
        run: npm --prefix distribution test
